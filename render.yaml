services:
  - type: web
    name: mgmu-did-backend
    env: node
    plan: starter
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: sqlite-data
      mountPath: /opt/render/project/src/backend/db
      sizeGB: 1
    envVars:
      - key: PORT
        value: 5000
      - key: BLOCKCHAIN_PROVIDER_URL
        sync: false
      - key: PRIVATE_KEY
        sync: false
      - key: CONTRACT_ADDRESS
        sync: false
      - key: JWT_SECRET
        generateValue: true
